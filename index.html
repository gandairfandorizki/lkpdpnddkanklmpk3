<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LKPD Smart Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f7f8;--card:#fff;--ink:#12313b;--mut:#5b717a;--pri:#0f6b7a;--pri2:#0b4f5b;--acc:#f0a202;--bd:#d6e1e4;--ok:#1b8a5a;--err:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1b1f;--card:#15262c;--ink:#e6f0f2;--mut:#8fa6ad;--pri:#3fb3c4;--pri2:#2b8f9e;--bd:#264047}}
:root[data-theme=dark]{--bg:#0e1b1f;--card:#15262c;--ink:#e6f0f2;--mut:#8fa6ad;--pri:#3fb3c4;--pri2:#2b8f9e;--bd:#264047}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Source Serif 4",Georgia,serif}
h1,h2,h3,.sans,button,label,input,select,textarea,nav{font-family:"Bricolage Grotesque",system-ui,sans-serif}
h1,h2,h3{margin:0 0 .5rem;line-height:1.15}a{color:var(--pri)}
.wrap{max-width:1080px;margin:auto;padding:0 18px}
button,.btn{cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--ink);padding:9px 14px;border-radius:8px;font-size:14px;font-weight:600}
button:hover{border-color:var(--pri)}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
.p{background:var(--pri);color:#fff;border-color:var(--pri)}.p:hover{background:var(--pri2)}.a{background:var(--acc);border-color:var(--acc);color:#2a1d00}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--ink);font-size:15px}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 4px;color:var(--mut)}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 0;gap:10px;flex-wrap:wrap}
.logo{font:800 20px "Bricolage Grotesque";display:flex;gap:8px;align-items:center;color:var(--ink)}
.logo i{background:var(--pri);color:#fff;width:32px;height:32px;border-radius:8px;display:grid;place-items:center;font-style:normal}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center;padding:36px 0}
.hero h1{font-size:clamp(34px,5vw,56px);font-weight:800}.hero p{color:var(--mut);max-width:52ch}
.sheet{background:#fff;color:#111;border-radius:6px;padding:22px;box-shadow:0 10px 30px #0f3a4433;transform:rotate(1.5deg);font-size:13px}
.sheet b{color:#0f6b7a}.sheet .ln{border-bottom:1.5px dashed #9bb;height:18px;margin:6px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:18px}
.card h3{font-size:18px}.card p{margin:0;color:var(--mut);font-size:15px}
section.s{padding:30px 0}section.s>h2{font-size:30px}
details{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px 16px;margin-bottom:8px}summary{cursor:pointer;font-weight:700;font-family:"Bricolage Grotesque"}
footer{border-top:1px solid var(--bd);padding:24px 0;color:var(--mut);font-size:14px;margin-top:30px}
.auth{max-width:420px;margin:30px auto}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
nav.side{background:var(--card);border-right:1px solid var(--bd);padding:16px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
nav.side button{text-align:left;border:0;background:none;padding:10px 12px}nav.side button.on{background:var(--pri);color:#fff}
main{padding:22px;min-width:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:14px 0}
.stat b{font:800 32px "Bricolage Grotesque";display:block;color:var(--pri)}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border-radius:99px}.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.prog{height:8px;background:var(--bd);border-radius:9px;overflow:hidden;margin:10px 0 4px}.prog i{display:block;height:100%;background:var(--acc);transition:width .3s}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);padding:11px 18px;border-radius:10px;color:#fff;font:600 14px "Bricolage Grotesque";z-index:50;max-width:90vw}
.spin{width:38px;height:38px;border:4px solid var(--bd);border-top-color:var(--pri);border-radius:50%;animation:sp 1s linear infinite;margin:20px auto}@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation-duration:3s}.prog i{transition:none}}
.tb{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:6px 0;z-index:5}
.tb button,.tb select{width:auto;padding:6px 9px;font-size:13px}
.paper-wrap{overflow-x:auto;padding:6px 0}
#doc{background:#fff;color:#111;width:210mm;min-height:297mm;margin:0 auto;padding:20mm;box-shadow:0 6px 24px #0003;font:12pt/1.5 "Source Serif 4",Georgia,serif;position:relative}
#doc.land{width:297mm;min-height:210mm}#doc h1{font-size:20pt}#doc h2{font-size:14pt;border-bottom:2px solid #0f6b7a;padding-bottom:2px;margin-top:18px;color:#0b4f5b}
#doc table{border-collapse:collapse;width:100%}#doc td,#doc th{border:1px solid #444;padding:6px;min-height:28px}#doc img{max-width:100%}
#doc .hd{display:flex;justify-content:space-between;border-bottom:1px solid #999;font-size:10pt;color:#555;margin-bottom:10px}
.ok{color:var(--ok)}.bad{color:var(--err)}
@media(max-width:800px){.hero{grid-template-columns:1fr}.app{grid-template-columns:1fr}nav.side{position:fixed;bottom:0;top:auto;left:0;right:0;height:auto;flex-direction:row;overflow-x:auto;z-index:20;border-top:1px solid var(--bd);border-right:0;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}nav.side .logo,nav.side .hide{display:none}nav.side button{white-space:nowrap;padding:8px 10px}main{padding:14px 12px 90px}.two{grid-template-columns:1fr}}
@media print{body *{visibility:hidden}#doc,#doc *{visibility:visible}#doc{position:absolute;left:0;top:0;box-shadow:none;margin:0;width:100%}.toast{display:none}}
</style></head><body><div id="root"></div><div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="claude-shim.js"></script>
<script>
const $=s=>document.querySelector(s),R=$('#root');
const LS={g(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},s(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){toast('Penyimpanan penuh atau diblokir browser.',1);return false}}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m,err){const t=$('#toast');t.innerHTML=`<div class="toast" style="background:${err?'#c0392b':'#1b8a5a'}" role="status">${esc(m)}</div>`;setTimeout(()=>t.innerHTML='',3200)}
const J={'SD/MI':['1','2','3','4','5','6'],'SMP/MTs':['7','8','9'],'SMA/MA':['10','11','12'],'SMK':['10','11','12'],'Perguruan Tinggi':Array.from({length:14},(_,i)=>'Semester '+(i+1))};
const MODELS=['Problem Based Learning','Project Based Learning','Discovery Learning','Inquiry Learning','Cooperative Learning','Contextual Teaching and Learning','Direct Instruction','Flipped Classroom','Blended Learning','Pembelajaran berdiferensiasi','Membaca terbimbing','Custom'];
const ACTS=['Pilihan ganda','Isian','Benar/Salah','Menjodohkan','Esai','Studi kasus','Diskusi','Observasi','Eksperimen','Praktik','Proyek','Analisis gambar','Analisis tabel','Analisis grafik','Refleksi','Kuis','HOTS','Literasi','Numerasi'];
const TPL={'SD/MI':['LKPD Tematik','LKPD Literasi','LKPD Numerasi','LKPD Eksperimen','LKPD Permainan'],'SMP/MTs':['LKPD Diskusi','LKPD Eksperimen','LKPD Problem Solving','LKPD Literasi'],'SMA/MA':['LKPD HOTS','LKPD Studi Kasus','LKPD Eksperimen','LKPD Project'],'SMK':['LKPD Praktik','LKPD Simulasi','LKPD Proyek','LKPD Dunia Kerja','LKPD Studi Kasus'],'Perguruan Tinggi':['LKPD Studi Kasus','LKPD Problem Based Learning','LKPD Project','LKPD Penelitian','LKPD Analisis','LKPD Diskusi Akademik']};
const TPLACT={'Tematik':['Literasi','Diskusi'],'Literasi':['Literasi','Isian'],'Numerasi':['Numerasi','Isian'],'Eksperimen':['Eksperimen','Observasi'],'Permainan':['Kuis','Menjodohkan'],'Diskusi':['Diskusi'],'Problem Solving':['Studi kasus','Numerasi'],'HOTS':['HOTS','Analisis tabel'],'Studi Kasus':['Studi kasus','Esai'],'Project':['Proyek'],'Proyek':['Proyek'],'Praktik':['Praktik'],'Simulasi':['Praktik','Studi kasus'],'Dunia Kerja':['Praktik','Studi kasus'],'Problem Based Learning':['Studi kasus','Esai'],'Penelitian':['Proyek','Analisis tabel'],'Analisis':['Analisis tabel','Esai'],'Diskusi Akademik':['Diskusi','Refleksi']};
let st={view:'land',page:'dash',user:null,w:null,step:1,docs:[],cur:null,busy:false,authMode:'login',q:'',fj:'',fav:false,aiMsg:'',parts:[],stg:0,undo:[]};
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const newW=()=>({jenjang:'SMA/MA',kelas:'10',sekolah:'',guru:'',mapel:'',semester:'',materi:'',waktu:'2 x 45 menit',pertemuan:'1',tujuan:'',kompetensi:'',kurikulum:'Kurikulum Merdeka',cp:'',model:'Problem Based Learning',grup:'Kelompok',acts:['Studi kasus','Diskusi'],level:'Sedang',kunci:true,rubrik:true,skor:true,kisi:false,rubAspek:['Pengetahuan','Keterampilan'],prodi:'',jml:'5'});
function boot(){const u=LS.g('lk_sess',null);if(u){st.user=LS.g('lk_users',[]).find(x=>x.email===u)||null}if(st.user){st.view='app';st.page=home();loadDocs();logAct()}render()}
const loadDocs=()=>st.docs=LS.g('lk_docs_'+st.user.email,[]);
const saveDocs=()=>LS.s('lk_docs_'+st.user.email,st.docs);
const stats=()=>LS.g('lk_stat_'+st.user.email,{dl:0,tpl:0,gen:0});
const bump=k=>{const s=stats();s[k]++;LS.s('lk_stat_'+st.user.email,s)};
function go(v,p){st.view=v;if(p)st.page=p;render();scrollTo(0,0)}
function startNew(tpl){st.parts=[];st.html='';st.w=newW();st.step=1;st.cur=null;if(tpl){const[j,t]=tpl;st.w.jenjang=j;st.w.kelas=J[j][0];const k=t.replace('LKPD ','');st.w.acts=TPLACT[k]||[];st.w.tpl=t;bump('tpl')}go('app','new')}
function render(){R.innerHTML=st.view==='land'?landing():st.view==='auth'?authV():appV();bind()}
function landing(){return`<div class="wrap"><div class="top"><div class="logo"><i>✎</i>LKPD Smart Generator</div><div class="row"><button onclick="go('auth');st.authMode='login';render()">Masuk</button><button class="p" onclick="st.authMode='reg';go('auth')">Daftar</button><button onclick="toggleDark()" aria-label="Mode gelap">◐</button></div></div>
<div class="hero"><div><h1>Buat LKPD Lebih Cepat, Kreatif, dan Terstruktur</h1><p>Untuk guru, dosen, dan mahasiswa pendidikan. Isi data pembelajaran, biarkan AI menyusun LKPD lengkap dengan aktivitas, evaluasi, kunci jawaban, dan rubrik untuk SD sampai perguruan tinggi.</p><div class="row"><button class="p" onclick="user()">Buat LKPD Sekarang</button><button onclick="st.authMode='login';go('auth')">Masuk</button></div></div>
<div class="sheet" aria-label="Contoh LKPD"><b>LKPD IPAS · Kelas 5 SD</b><br>Materi: Ekosistem · PBL<div style="margin:8px 0"><b>Stimulus:</b> Sawah dekat sekolah mendadak dipenuhi tikus. Mengapa burung hantu menghilang?</div><b>Aktivitas 1:</b> Gambar rantai makanan sawah.<div class="ln"></div><div class="ln"></div><b>Aktivitas 2:</b> Diskusikan dampak hilangnya burung hantu.<div class="ln"></div><b>Refleksi:</b> Aku paham bahwa…<div class="ln"></div></div></div>
<section class="s"><h2>Fitur utama</h2><div class="grid">${[['Wizard 7 langkah','Jenjang, informasi, model, aktivitas, kesulitan, generate, edit.'],['AI Generator','LKPD lengkap 19 komponen, bahasa sesuai jenjang.'],['Editor dokumen','Font, warna, tabel, gambar, undo/redo, dan 10 aksi AI.'],['Kunci & rubrik','Kunci jawaban, rubrik, pedoman skor, kisi-kisi.'],['Validasi','Pemeriksaan otomatis: siap digunakan atau perlu diperbaiki.'],['Simpan & ekspor','Draft, favorit, duplikasi, cetak/PDF, dan Word.']].map(f=>`<div class="card"><h3>${f[0]}</h3><p>${f[1]}</p></div>`).join('')}</div></section>
<section class="s"><h2>Cara menggunakan</h2><div class="grid">${['Isi data pembelajaran','Pilih model dan aktivitas','Klik Generate','Edit dan preview','Unduh PDF/Word'].map((t,i)=>`<div class="card"><h3>${i+1}. ${t}</h3></div>`).join('')}</div></section>
<section class="s"><h2>Template per jenjang</h2><div class="grid">${Object.entries(TPL).map(([j,l])=>`<div class="card"><h3>${j}</h3><p>${l.join(', ')}</p></div>`).join('')}</div></section>
<section class="s"><h2>FAQ</h2>${[['Apakah gratis?','Aplikasi ini berjalan di browser Anda; pembuatan LKPD memakai AI Claude melalui akun Anda.'],['Apakah hasilnya harus diperiksa?','Ya. Selalu tinjau materi dan kunci jawaban sebelum dipakai di kelas.'],['Di mana data disimpan?','Di penyimpanan browser perangkat ini.']].map(f=>`<details><summary>${f[0]}</summary>${f[1]}</details>`).join('')}</section>
<footer>© 2026 LKPD Smart Generator · Dibuat untuk dunia pendidikan Indonesia</footer></div>`}
function user(){if(st.user)go('app',home());else{st.authMode='reg';go('auth')}}
function toggleDark(){const r=document.documentElement;const d=getComputedStyle(r).getPropertyValue('--bg').trim()==='#0e1b1f';r.dataset.theme=d?'light':'dark'}
function authV(){const m=st.authMode;return`<div class="wrap auth"><div class="logo" style="margin-bottom:14px"><i>✎</i>LKPD Smart Generator</div><div class="card"><h2>${m==='reg'?'Daftar akun':m==='forgot'?'Lupa password':'Masuk'}</h2><form id="af" novalidate>
${m==='reg'?`<label>Nama lengkap</label><input name="nama" required><label>Peran</label><select name="peran">${['Guru','Dosen','Siswa','Mahasiswa','Tenaga kependidikan'].map(x=>`<option>${x}</option>`).join('')}</select><label>Institusi</label><input name="inst"><label>Jenjang</label><select name="jenjang">${Object.keys(J).map(x=>`<option>${x}</option>`).join('')}</select><label>Mata pelajaran/bidang studi</label><input name="mapel">`:''}
<label>Email</label><input name="email" type="email" required autocomplete="email"><label>${m==='forgot'?'Password baru':'Password (min. 6 karakter)'}</label><input name="pw" type="password" required autocomplete="${m==='login'?'current-password':'new-password'}">
<div id="aerr" class="bad sans" style="min-height:22px;margin-top:8px"></div><button class="p" style="width:100%">${m==='reg'?'Daftar':m==='forgot'?'Atur ulang password':'Masuk'}</button></form>
<div class="row" style="margin-top:12px;font-size:14px">${m!=='login'?'<a href="#" onclick="st.authMode=\'login\';render();return false">Masuk</a>':''}${m!=='reg'?'<a href="#" onclick="st.authMode=\'reg\';render();return false">Daftar</a>':''}${m==='login'?'<a href="#" onclick="st.authMode=\'forgot\';render();return false">Lupa password?</a>':''}<a href="#" onclick="go(\'land\');return false">Beranda</a></div></div></div>`}
async function doAuth(f){const d=Object.fromEntries(new FormData(f)),m=st.authMode,E=$('#aerr'),us=LS.g('lk_users',[]);d.email=(d.email||'').trim().toLowerCase();
if(!/^\S+@\S+\.\S+$/.test(d.email))return E.textContent='Format email tidak valid.';if((d.pw||'').length<6)return E.textContent='Password minimal 6 karakter.';
const i=us.findIndex(x=>x.email===d.email),h=await sha(d.pw);
if(m==='reg'){if(!d.nama.trim())return E.textContent='Nama lengkap wajib diisi.';if(i>=0)return E.textContent='Email sudah terdaftar. Silakan masuk.';us.push({email:d.email,nama:d.nama.trim(),peran:d.peran,inst:d.inst,jenjang:d.jenjang,mapel:d.mapel,h});LS.s('lk_users',us)}
else if(m==='forgot'){if(i<0)return E.textContent='Email belum terdaftar.';us[i].h=h;LS.s('lk_users',us);st.authMode='login';render();return toast('Password diperbarui. Silakan masuk.')}
else if(i<0||us[i].h!==h)return E.textContent='Email atau password salah.';
LS.s('lk_sess',d.email);st.user=LS.g('lk_users',[]).find(x=>x.email===d.email);loadDocs();logAct();toast('Selamat datang, '+st.user.nama);go('app',home())}
const NAV=[['dash','Dashboard'],['new','Buat LKPD'],['mine','LKPD Saya'],['tpl','Template'],['draft','Draft'],['fav','Favorit'],['hist','Riwayat'],['prof','Profil'],['set','Pengaturan']];
function appV(){return`<div class="app"><nav class="side"><div class="logo" style="margin-bottom:12px"><i>✎</i>LKPD Smart</div>${navFor().map(n=>`<button class="${st.page===n[0]?'on':''}" onclick="${n[0]==='new'?'startNew()':`st.page='${n[0]}';render()`}">${n[1]}</button>`).join('')}<button class="hide" style="margin-top:auto" onclick="logout()">Keluar</button></nav><main>${PAGES[st.page]()}</main></div>`}
function logout(){LS.s('lk_sess',null);st.user=null;go('land');toast('Anda telah keluar.')}
const card=d=>`<div class="card"><h3>${esc(d.title)}</h3><p class="sans" style="font-size:13px">${esc(d.w.jenjang)} · ${esc(d.w.kelas)} · ${esc(d.w.mapel)} · ${d.status}${d.fav?' ★':''}</p><p style="font-size:13px">Diubah ${new Date(d.updated).toLocaleString('id-ID')}${d.tags?' · #'+esc(d.tags):''}</p><div class="row" style="margin-top:10px"><button onclick="openDoc('${d.id}')">Edit</button><button onclick="favDoc('${d.id}')">${d.fav?'Hapus favorit':'Favorit'}</button><button onclick="dupDoc('${d.id}')">Duplikat</button><button onclick="delDoc('${d.id}')">Hapus</button></div></div>`;
const list=(arr,empty)=>arr.length?`<div class="grid">${arr.map(card).join('')}</div>`:`<div class="card"><p>${empty}</p><button class="p" style="margin-top:10px" onclick="startNew()">Buat LKPD baru</button></div>`;
const PAGES={
dash(){const s=stats();return`<h1>Halo, ${esc(st.user.nama)}</h1><p>Mulai dengan: Isi → Generate → Edit → Preview → Download.</p><button class="p" onclick="startNew()">+ Buat LKPD Baru</button><div class="stats">${[['Dibuat',s.gen],['Tersimpan',st.docs.length],['Diunduh',s.dl],['Template dipakai',s.tpl]].map(x=>`<div class="card stat"><b>${x[1]}</b>${x[0]}</div>`).join('')}</div><h2>Terakhir diedit</h2>${list(st.docs.slice(0,3),'Belum ada LKPD. Buat yang pertama sekarang.')}`},
mine(){const f=st.docs.filter(d=>(!st.q||(d.title+d.w.mapel+d.w.model+(d.tags||'')).toLowerCase().includes(st.q.toLowerCase()))&&(!st.fj||d.w.jenjang===st.fj));return`<h1>LKPD Saya</h1><div class="two"><input id="q" placeholder="Cari judul, mapel, model, tag…" value="${esc(st.q)}"><select id="fj"><option value="">Semua jenjang</option>${Object.keys(J).map(j=>`<option ${st.fj===j?'selected':''}>${j}</option>`).join('')}</select></div><br>${list(f,'Tidak ada LKPD yang cocok.')}`},
draft(){return`<h1>Draft</h1>${list(st.docs.filter(d=>d.status==='Draft'),'Tidak ada draft.')}`},
fav(){return`<h1>LKPD Favorit</h1>${list(st.docs.filter(d=>d.fav),'Belum ada favorit. Tandai LKPD dengan tombol Favorit.')}`},
hist(){const h=st.docs.flatMap(d=>(d.hist||[]).map(x=>({t:d.title,x})));return`<h1>Riwayat</h1>${h.length?h.sort((a,b)=>b.x.at-a.x.at).slice(0,60).map(r=>`<div class="card" style="margin-bottom:8px"><b class="sans">${esc(r.t)}</b> — ${esc(r.x.a)} <span style="color:var(--mut)">${new Date(r.x.at).toLocaleString('id-ID')}</span></div>`).join(''):'<div class="card">Belum ada riwayat perubahan.</div>'}`},
tpl(){return`<h1>Template LKPD</h1>${Object.entries(TPL).map(([j,l])=>`<h2 style="margin-top:18px">${j}</h2><div class="grid">${l.map(t=>`<div class="card"><h3>${t}</h3><button class="p" onclick='startNew(["${j}","${t}"])'>Gunakan template</button></div>`).join('')}</div>`).join('')}`},

async function refAI(){const o=$('#rout');o.textContent='Mencari saran…';try{const r=await ask(refP()+' Jangan mengarang tautan atau DOI; jika tidak yakin, tulis judul/penulis saja dan beri catatan "verifikasi".',{onText:({text})=>o.textContent=text.replace(/<[^>]+>/g,'')});o.textContent=r.html+'\n\n⚠ Saran dari AI tanpa akses internet: verifikasi setiap referensi sebelum dipakai.'}catch(e){o.textContent='Gagal: '+errMsg(e)}}

let CA=[],CE=[],SP=30;const today=()=>new Date().toISOString().slice(0,10),KKM=()=>+(localStorage.getItem('lk_kkm')||75);
const num=v=>v!==undefined&&v!==null&&v!==''&&!isNaN(+v),pred=s=>num(s)?(+s>=90?'A':+s>=80?'B':+s>=70?'C':'D'):'',avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null,f1=v=>v===null?'-':v.toFixed(1);
const wd=(a,b)=>{let c=0;for(let d=new Date(a);d<=b;d.setDate(d.getDate()+1)){const g=d.getDay();if(g&&g!==6)c++}return Math.max(c,1)};
function navFor(){const r=roleOf(st.user);return r==='cr'?NAV.slice(0,2).concat([['hasil','Hasil & Presensi'],['ref','Referensi']],NAV.slice(2)):r==='st'?[['tugas','Tugas Saya'],['hasilsiswa','Hasil & Absensi'],['prof','Profil'],['set','Pengaturan']]:[['kinerja','Dashboard Kinerja'],['prof','Profil'],['set','Pengaturan']]}
async function openByCode(){const k=($('#kode').value||'').trim().toUpperCase();if(!k)return;try{const p=(await rows('pub',['code','==',k]))[0];if(!p)return toast('Kode tidak ditemukan.',1);const u=st.user;await(await dcol('enr')).doc(p.id+'_'+sk(u.email)).set({pubId:p.id,email:u.email,nama:u.nama,inst:u.inst||'',at:Date.now()});const L=LS.g('lk_codes_'+u.email,[]);if(!L.includes(k))L.push(k);LS.s('lk_codes_'+u.email,L);render()}catch(e){toast(e.message||'Gagal.',1)}}
async function doTask(id){const p=CP.find(x=>x.id===id),u=st.user;let s=null;try{s=(r=>r.exists?r.data():null)(await(await dcol('sub')).doc(id+'_'+sk(u.email)).get());const c=await dcol('att'),d=c.doc(id+'_'+sk(u.email));if(!(await d.get()).exists)await d.set({pubId:id,email:u.email,nama:u.nama,inst:u.inst||'',status:'Hadir',date:today(),owner:p.owner,at:Date.now()})}catch(e){}st.task={p,s};st.page='kerja';render()}
async function kirim(){const p=st.task.p,u=st.user;try{await(await dcol('sub')).doc(p.id+'_'+sk(u.email)).set({pubId:p.id,title:p.title,email:u.email,nama:u.nama,inst:u.inst||'',html:$('#doc').innerHTML,at:Date.now()});await(await dcol('enr')).doc(p.id+'_'+sk(u.email)).set({pubId:p.id,email:u.email,nama:u.nama,inst:u.inst||'',at:Date.now()});toast('Jawaban terkirim.')}catch(e){toast(e.message||'Gagal mengirim.',1)}}
PAGES.hasilsiswa=()=>`<h1>Hasil &amp; Absensi</h1>`+lazy(async()=>{const L=LS.g('lk_codes_'+st.user.email,[]),[P0,S,A]=await Promise.all([rows('pub'),rows('sub',['email','==',st.user.email]),rows('att',['email','==',st.user.email])]),P=P0.filter(p=>L.includes(p.code));if(!P.length)return'<div class="card">Belum ada tugas. Masukkan kode LKPD di menu Tugas Saya.</div>';
const R=P.map(p=>({p,s:S.find(x=>x.pubId===p.id),a:A.find(x=>x.pubId===p.id)})),h=R.filter(r=>r.a&&r.a.status==='Hadir').length,sc=R.filter(r=>r.s&&num(r.s.score)).map(r=>+r.s.score);
return`<div class="grid"><div class="card"><small>Kehadiran</small><h2>${Math.round(h/P.length*100)}%</h2><small>${h} dari ${P.length} pertemuan</small></div><div class="card"><small>Rata-rata nilai</small><h2>${f1(avg(sc))}</h2><small>${pred(avg(sc))}</small></div></div><br><div style="overflow-x:auto"><table class="sans" style="width:100%;border-collapse:collapse" border="1" cellpadding="8"><tr><th>LKPD</th><th>Absensi</th><th>Tanggal</th><th>Status</th><th>Nilai</th><th>Predikat</th><th>Evaluasi guru</th></tr>${R.map(r=>`<tr><td>${esc(r.p.title)}</td><td>${r.a?esc(r.a.status):'Belum hadir'}</td><td>${r.a?esc(r.a.date):'-'}</td><td>${r.s?'Terkirim':'Belum'}</td><td>${r.s&&num(r.s.score)?esc(r.s.score):'-'}</td><td>${r.s?pred(r.s.score):''}</td><td>${r.s?esc(r.s.note||''):''}</td></tr>`).join('')}</table></div>`});
const roster=pid=>{const m=new Map(),add=(x,o)=>{const k=sk(x.email);if(!m.has(k))m.set(k,{k,email:x.email,nama:x.nama,inst:x.inst||''})};CE.filter(e=>e.pubId===pid).forEach(add);CS.filter(s=>s.pubId===pid).forEach(add);return[...m.values()].map(u=>({...u,sub:CS.find(s=>s.pubId===pid&&sk(s.email)===u.k),att:CA.find(a=>a.pubId===pid&&sk(a.email)===u.k)})).sort((a,b)=>a.nama.localeCompare(b.nama))};
async function hasilLoad(){const P=CPH=await rows('pub',['owner','==',st.user.email]);CS=[];CA=[];CE=[];if(!P.length)return'<div class="card">Belum ada LKPD diterbitkan. Buka editor, lalu klik "Terbitkan ke siswa".</div>';for(const p of P){const[S,A,E]=await Promise.all([rows('sub',['pubId','==',p.id]),rows('att',['pubId','==',p.id]),rows('enr',['pubId','==',p.id])]);CS=CS.concat(S);CA=CA.concat(A);CE=CE.concat(E)}
let h=`<div class="row sans"><button class="p" onclick="xlsxHasil()">Unduh Rekap Excel</button><label>KKM <input style="width:70px" value="${KKM()}" onchange="localStorage.setItem('lk_kkm',this.value)"></label><span style="font-size:12px">Diperbarui ${new Date().toLocaleTimeString('id-ID')} · otomatis tiap 10 detik</span></div><br>`;
for(const p of P){const R=roster(p.id),sc=R.filter(r=>r.sub&&num(r.sub.score)).map(r=>+r.sub.score),tn=sc.length?Math.round(sc.filter(x=>x>=KKM()).length/sc.length*100)+'%':'-';
h+=`<div class="card" style="margin-bottom:12px"><h3>${esc(p.title)} · kode ${p.code}</h3><p class="sans" style="font-size:13px">${R.length} siswa · hadir ${R.filter(r=>r.att&&r.att.status==='Hadir').length} · terkirim ${R.filter(r=>r.sub).length} · rata-rata ${f1(avg(sc))} · tuntas ${tn}</p><div style="overflow-x:auto"><table class="sans" style="width:100%;border-collapse:collapse"><tr><th>Nama</th><th>Presensi</th><th>Dikirim</th><th>Nilai</th><th>Pred.</th><th>Evaluasi</th><th></th></tr>${R.map(r=>{const i=p.id+'_'+r.k,d=r.sub?'':'disabled';return`<tr><td>${esc(r.nama)}</td><td><select id="pr_${i}">${['Hadir','Izin','Sakit','Alpa'].map(x=>`<option ${((r.att&&r.att.status)||'Alpa')===x?'selected':''}>${x}</option>`).join('')}</select></td><td>${r.sub?new Date(r.sub.at).toLocaleString('id-ID'):'-'}</td><td><input id="n_${i}" style="width:70px" value="${esc(r.sub?r.sub.score??'':'')}" ${d}></td><td>${r.sub?pred(r.sub.score):''}</td><td><input id="c_${i}" value="${esc(r.sub?r.sub.note||'':'')}" placeholder="Evaluasi singkat" ${d}></td><td><button onclick="saveRow('${p.id}','${r.k}')">Simpan</button>${r.sub?` <button onclick="lihat('${r.sub.id}')">Lihat</button>`:''}</td></tr>`}).join('')}</table></div></div>`}
return h+'<div id="vsub"></div>'}
PAGES.hasil=()=>{clearInterval(HT);HT=setInterval(async()=>{const e=$('#pg'),v=$('#vsub'),a=document.activeElement;if(st.page!=='hasil'||!e)return clearInterval(HT);if((v&&v.innerHTML)||(e.contains(a)&&/INPUT|SELECT/.test(a.tagName)))return;try{e.innerHTML=await hasilLoad()}catch(x){}},10000);return`<h1>Hasil, Evaluasi &amp; Presensi Siswa</h1>`+lazy(hasilLoad)};
async function saveRow(pid,k){const r=roster(pid).find(x=>x.k===k),i=pid+'_'+k;try{await(await dcol('att')).doc(i).set({pubId:pid,email:r.email,nama:r.nama,inst:r.inst,status:$('#pr_'+i).value,date:r.att?r.att.date:today(),owner:st.user.email,at:Date.now()});if(r.sub)await(await dcol('sub')).doc(r.sub.id).update({score:$('#n_'+i).value,note:$('#c_'+i).value,evaluator:st.user.nama});toast('Tersimpan.')}catch(e){toast(e.message||'Gagal menyimpan.',1)}}
async function dlX(wb,name){const d=await claude.use('downloads');if(!d)throw{message:'Download tidak tersedia.'};await d.save({filename:name,data:new Blob([XLSX.write(wb,{bookType:'xlsx',type:'array'})],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})})}
const sheet=(wb,n,A,w)=>{const s=XLSX.utils.aoa_to_sheet(A);s['!cols']=w.map(x=>({wch:x}));XLSX.utils.book_append_sheet(wb,s,n)};
async function xlsxHasil(){try{if(typeof XLSX==='undefined')throw{message:'Pustaka Excel gagal dimuat. Muat ulang halaman.'};await hasilLoad();const K=KKM(),A=[['Nama','Instansi/Kelas','LKPD','Presensi','Tanggal hadir','Dikirim','Nilai','Predikat','Ketuntasan','Evaluasi guru']],T={},J=[['Nama','LKPD','Jawaban (teks)']];
CPH.forEach(p=>roster(p.id).forEach(r=>{const st_=r.att?r.att.status:'Alpa',n=r.sub&&num(r.sub.score)?+r.sub.score:'';A.push([r.nama,r.inst,p.title,st_,r.att?r.att.date:'',r.sub?new Date(r.sub.at).toLocaleString('id-ID'):'',n,pred(n),n===''?'':n>=K?'Tuntas':'Belum tuntas',r.sub?r.sub.note||'':'']);const t=T[r.k]=T[r.k]||{nama:r.nama,inst:r.inst,n:0,H:0,I:0,S:0,Al:0,k:0,sc:[]};t.n++;t[{Hadir:'H',Izin:'I',Sakit:'S',Alpa:'Al'}[st_]]++;if(r.sub){t.k++;if(n!=='')t.sc.push(n)}if(r.sub)J.push([r.nama,p.title,(new DOMParser().parseFromString(r.sub.html||'','text/html').body.textContent||'').replace(/\s+/g,' ').slice(0,30000)])}));
const B=[['Nama','Instansi/Kelas','Jumlah LKPD','Hadir','Izin','Sakit','Alpa','% Kehadiran','Terkirim','Rata-rata nilai','Predikat','Ketuntasan']].concat(Object.values(T).sort((a,b)=>a.nama.localeCompare(b.nama)).map(t=>{const a=avg(t.sc);return[t.nama,t.inst,t.n,t.H,t.I,t.S,t.Al,Math.round(t.H/t.n*100),t.k,a===null?'':+a.toFixed(1),a===null?'':pred(a),a===null?'':a>=K?'Tuntas':'Belum tuntas']}));
const wb=XLSX.utils.book_new();sheet(wb,'Presensi & Nilai',A,[24,18,30,10,13,20,8,9,13,40]);sheet(wb,'Rekap Siswa',B,[24,18,12,8,8,8,8,12,10,14,9,14]);sheet(wb,'Jawaban',J,[24,30,100]);await dlX(wb,'Rekap_Presensi_Nilai_'+today()+'.xlsx');toast('Excel diunduh.')}catch(e){toast(e.message||'Gagal membuat Excel.',1)}}
async function kinData(){const[A,P,S,AT]=await Promise.all([rows('act'),rows('pub'),rows('sub'),rows('att')]),now=Date.now(),from=now-SP*864e5,wdn=wd(new Date(from),new Date(now)),G={};
A.filter(a=>/^(Guru|Dosen)$/.test(a.peran)).forEach(a=>{const u=G[a.email]=G[a.email]||{email:a.email,nama:a.nama,peran:a.peran,inst:a.inst||'',days:new Set(),all:new Set(),last:0};u.all.add(a.date);if(a.at>=from)u.days.add(a.date);u.last=Math.max(u.last,a.at)});
const R=Object.values(G).map(u=>{const ap=P.filter(p=>p.owner===u.email),ids=ap.map(p=>p.id),ms=S.filter(s=>ids.includes(s.pubId)&&s.at>=from),sc=ms.filter(s=>num(s.score)).map(s=>+s.score);return{...u,pct:Math.min(100,Math.round(u.days.size/wdn*100)),lkpd:ap.length,baru:ap.filter(p=>p.at>=from).length,masuk:ms.length,dinilai:sc.length,avg:avg(sc),tuntas:sc.length?Math.round(sc.filter(x=>x>=KKM()).length/sc.length*100):null,idle:Math.floor((now-u.last)/864e5),sc}}).sort((a,b)=>b.pct-a.pct);return{R,A,wdn,now}}
const stat=r=>r.pct>=80?['Baik','#1a7f4b']:r.pct>=60?['Perlu perhatian','#b7791f']:['Rendah','#c53030'];
async function kinLoad(){const{R,A,wdn,now}=await kinData();if(!R.length)return'<div class="card">Belum ada data guru/dosen.</div>';const all=R.flatMap(r=>r.sc),dn=Array.from({length:14},(_,i)=>new Date(now-(13-i)*864e5).toISOString().slice(0,10)),act=dn.map(d=>new Set(A.filter(a=>a.date===d&&/^(Guru|Dosen)$/.test(a.peran)).map(a=>a.email)).size),mx=Math.max(1,...act),sm=R.reduce((t,r)=>t+r.masuk,0),sd=R.reduce((t,r)=>t+r.dinilai,0);
const K=[['Guru/Dosen aktif',R.filter(r=>r.days.size).length+' / '+R.length],['Rata-rata kehadiran',Math.round(avg(R.map(r=>r.pct)))+'%'],['LKPD terbit',R.reduce((t,r)=>t+r.baru,0)],['Jawaban masuk',sm],['Sudah dinilai',sm?Math.round(sd/sm*100)+'%':'-'],['Rata-rata nilai siswa',f1(avg(all))],['Ketuntasan',all.length?Math.round(all.filter(x=>x>=KKM()).length/all.length*100)+'%':'-']];
const W=[];R.forEach(r=>{if(r.idle>7)W.push(`${r.nama}: tidak login ${r.idle} hari`);if(r.masuk>3&&r.dinilai/r.masuk<.5)W.push(`${r.nama}: ${r.masuk-r.dinilai} jawaban siswa belum dinilai`);if(r.pct<60)W.push(`${r.nama}: kehadiran ${r.pct}% (di bawah 60%)`)});
const bars=act.map((v,i)=>`<rect x="${i*28+4}" y="${70-v/mx*60}" width="20" height="${v/mx*60}" rx="3" fill="#0f766e"/><text x="${i*28+14}" y="82" font-size="9" text-anchor="middle" fill="#888">${dn[i].slice(8)}</text>`).join('');
return`<div class="grid">${K.map(k=>`<div class="card"><small>${k[0]}</small><h2 style="margin:4px 0">${k[1]}</h2></div>`).join('')}</div><br><div class="card sans"><b>Guru/dosen aktif per hari (14 hari)</b><svg viewBox="0 0 400 90" style="width:100%;max-width:560px">${bars}</svg></div><br>${W.length?`<div class="card sans" style="border-left:4px solid #c53030"><b>Perlu tindak lanjut</b><ul>${W.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><br>`:'<div class="card sans" style="border-left:4px solid #1a7f4b">✓ Tidak ada peringatan pada periode ini.</div><br>'}<div style="overflow-x:auto"><table class="sans" style="width:100%;border-collapse:collapse" border="1" cellpadding="8"><tr><th>Guru/Dosen</th><th>Kehadiran (${wdn} hari kerja)</th><th>14 hari</th><th>LKPD</th><th>Jawaban</th><th>Dinilai</th><th>Rata-rata</th><th>Status</th></tr>${R.map(r=>`<tr><td>${esc(r.nama)}<br><small>${r.peran} ${esc(r.inst)}</small></td><td><div style="background:#e5e7eb;border-radius:6px;height:10px;width:120px"><div style="background:${stat(r)[1]};height:10px;border-radius:6px;width:${r.pct}%"></div></div>${r.pct}% (${r.days.size} hari)</td><td>${dn.map(d=>`<span title="${d}" style="display:inline-block;width:9px;height:9px;margin:1px;border-radius:2px;background:${r.all.has(d)?'#0f766e':'#d1d5db'}"></span>`).join('')}</td><td>${r.lkpd} (${r.baru} baru)</td><td>${r.masuk}</td><td>${r.dinilai}</td><td>${f1(r.avg)}</td><td style="color:${stat(r)[1]};font-weight:700">${stat(r)[0]}</td></tr>`).join('')}</table></div>`}
PAGES.kinerja=()=>{clearInterval(HT);HT=setInterval(async()=>{const e=$('#pg');if(st.page!=='kinerja'||!e)return clearInterval(HT);try{e.innerHTML=await kinLoad()}catch(x){}},15000);return`<h1>Dashboard Kinerja &amp; Kehadiran Guru/Dosen</h1><div class="row sans"><label>Periode</label><select onchange="SP=+this.value;render()">${[7,30,90].map(d=>`<option value="${d}" ${SP===d?'selected':''}>${d} hari terakhir</option>`).join('')}</select><button class="p" onclick="xlsxKin()">Unduh Excel</button><span style="font-size:12px">Data diperbarui otomatis tiap 15 detik</span></div><br>`+lazy(kinLoad)};
async function xlsxKin(){try{if(typeof XLSX==='undefined')throw{message:'Pustaka Excel gagal dimuat.'};const{R,A}=await kinData(),wb=XLSX.utils.book_new();sheet(wb,'Kinerja Guru',[['Nama','Peran','Instansi','Hari hadir','% Kehadiran','LKPD total','LKPD baru','Jawaban masuk','Dinilai','Rata-rata nilai','% Tuntas','Hari sejak login terakhir','Status']].concat(R.map(r=>[r.nama,r.peran,r.inst,r.days.size,r.pct,r.lkpd,r.baru,r.masuk,r.dinilai,r.avg===null?'':+r.avg.toFixed(1),r.tuntas===null?'':r.tuntas,r.idle,stat(r)[0]])),[24,10,20,10,12,10,10,13,8,14,10,18,16]);sheet(wb,'Presensi Harian',[['Tanggal','Nama','Peran','Waktu login']].concat(A.filter(a=>/^(Guru|Dosen)$/.test(a.peran)).sort((a,b)=>b.at-a.at).map(a=>[a.date,a.nama,a.peran,new Date(a.at).toLocaleTimeString('id-ID')])),[12,24,10,12]);await dlX(wb,'Rekap_Kinerja_Guru_'+today()+'.xlsx');toast('Excel diunduh.')}catch(e){toast(e.message||'Gagal.',1)}}
boot();
